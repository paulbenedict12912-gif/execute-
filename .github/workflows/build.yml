name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK platform + build-tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate placeholder launcher icon
        run: |
          mkdir -p app/src/main/res/mipmap-hdpi
          if [ ! -f app/src/main/res/mipmap-hdpi/ic_launcher.png ]; then
            convert -size 192x192 xc:"#7C4DFF" \
              -fill white -gravity center -pointsize 96 -annotate +0+0 "R" \
              app/src/main/res/mipmap-hdpi/ic_launcher.png
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RblxExec-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
